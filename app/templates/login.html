{% extends "base.html" %}
{% block content %}
<div class="auth-container">
  <h1>{{ t('auth.login_title') }}</h1>
  {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ request.query_params.get('next', '/dashboard') }}">
    <div class="field">
      <label>{{ t('auth.email') }}</label>
      <input type="email" name="email" required autofocus>
    </div>
    <div class="field">
      <label>{{ t('auth.password') }}</label>
      <input type="password" name="password" required>
    </div>
    <button class="btn btn-block" type="submit">{{ t('auth.login_button') }}</button>
  </form>
  <p class="muted" style="margin-top:1rem;">
    {{ t('auth.no_account') }} <a href="/register">{{ t('nav.register') }}</a>
  </p>
</div>
{% endblock %}
