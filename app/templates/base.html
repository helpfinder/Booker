<!DOCTYPE html>
<html lang="{{ lang or 'sk' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t('app_name') }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if user %}
  <div class="topnav">
    <div class="brand">📚 {{ t('app_name') }}</div>
    <nav>
      <a href="/search" class="{{ 'active' if request.url.path == '/search' }}">{{ t('nav.search') }}</a>
      <a href="/library" class="{{ 'active' if request.url.path == '/library' }}">{{ t('nav.library') }}</a>
      <a href="/dashboard" class="{{ 'active' if request.url.path == '/dashboard' }}">{{ t('nav.dashboard') }}</a>
      <a href="/series" class="{{ 'active' if request.url.path == '/series' }}">{{ t('nav.series') }}</a>
    </nav>
    <div style="display:flex; align-items:center; gap:1rem;">
      <div class="lang-switch">
        {% for code in supported_languages %}
        <form method="post" action="/account/language" style="display:inline;">
          <input type="hidden" name="language" value="{{ code }}">
          <button type="submit" class="{{ 'active' if lang == code }}">{{ code|upper }}</button>
        </form>
        {% endfor %}
      </div>
      <span class="muted">{{ user.username }}</span>
      <a href="/logout">{{ t('nav.logout') }}</a>
    </div>
  </div>
  {% endif %}

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <footer class="site-footer">
    Book Tracker &middot; <a href="https://github.com/" target="_blank" rel="noopener">open source</a>
  </footer>
</body>
</html>
